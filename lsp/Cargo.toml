[package]
name = "rest-nav-lsp"
version = "0.1.1"
edition = "2021"
description = "Spring MVC REST endpoint language server (workspace symbols) for Zed"
license = "MIT"

[[bin]]
name = "rest-nav-lsp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"

[profile.release]
opt-level = 2
lto = true
strip = true

# 独立 workspace：与根扩展 crate 分离（根是 wasm cdylib，lsp 是原生二进制）
[workspace]